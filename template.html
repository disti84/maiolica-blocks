<title>Tap the Lemon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--FONTS-->
<style>
/* Demo game styles. Keep the structure (#loading, #app, screens, overlays) and restyle freely.
   Palette and buttons come from Dolce Sort, so the Paw Software games share a family look. */
:root {
  --cobalt: #1d4596;
  --cobalt-deep: #12306e;
  --lemon: #f5c518;
  --lemon-deep: #d9a400;
  --tile: #f7fafd;
  --tile-line: #c9d6ee;
  --ink: #15264f;
  --card: #ffffff;
  --red: #d7263d;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background-color: var(--tile);
  background-image:
    radial-gradient(circle at 50% 50%, transparent 0 9px, var(--tile-line) 10px 11px, transparent 12px),
    linear-gradient(var(--tile-line) 0 1px, transparent 1px),
    linear-gradient(90deg, var(--tile-line) 0 1px, transparent 1px);
  background-size: 64px 64px;
  color: var(--ink);
  font-family: var(--body);
  font-weight: 800;
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
#app {
  height: 100%;
  max-width: 560px;
  margin: 0 auto;
  box-sizing: border-box;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));
  display: flex;
  flex-direction: column;
}
.screen { flex: 1; display: flex; flex-direction: column; min-height: 0; gap: 12px; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 3px solid var(--lemon); outline-offset: 2px; }

/* ---------- Loading ---------- */
.loading { position: fixed; inset: 0; display: grid; place-items: center; }
.spinner { width: 44px; height: 44px; border-radius: 50%; border: 5px solid var(--tile-line); border-top-color: var(--cobalt); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Buttons ---------- */
.btn {
  font-family: var(--display);
  font-size: 1.35rem;
  letter-spacing: .02em;
  color: var(--ink);
  background: var(--lemon);
  border-radius: 18px;
  padding: 14px 26px;
  box-shadow: 0 5px 0 var(--lemon-deep), 0 8px 18px rgba(18, 48, 110, .18);
  transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--lemon-deep); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.blue { background: var(--cobalt); color: #fff; box-shadow: 0 5px 0 var(--cobalt-deep), 0 8px 18px rgba(18, 48, 110, .25); }
.btn.blue:active { box-shadow: 0 1px 0 var(--cobalt-deep); }
.btn.ghost { background: var(--card); box-shadow: 0 5px 0 var(--tile-line); font-size: 1.1rem; }
.icon-btn {
  width: 46px; height: 46px; border-radius: 14px; background: var(--card);
  box-shadow: 0 4px 0 var(--tile-line); display: grid; place-items: center; flex: none;
}
.icon-btn svg { width: 26px; height: 26px; }

/* ---------- Home ---------- */
#home { align-items: center; text-align: center; }
.home-top { width: 100%; display: flex; justify-content: flex-end; }
.logo-tile {
  background: var(--cobalt); border-radius: 28px; padding: 16px 26px 14px;
  border: 5px solid #fff; box-shadow: 0 0 0 4px var(--cobalt), 0 14px 30px rgba(18, 48, 110, .28);
  rotate: -2deg;
}
.logo-tile h1 {
  font-family: var(--display); font-weight: 400; margin: 0;
  font-size: clamp(2.4rem, 12vw, 3.4rem); line-height: .95;
  color: var(--lemon); text-shadow: 0 4px 0 var(--cobalt-deep);
}
.tagline { margin: 6px 0 0; font-size: 1rem; }
.how {
  background: var(--card); border-radius: 18px; border: 3px solid var(--tile-line);
  padding: 10px 14px; font-size: .95rem; line-height: 1.35; max-width: 34ch; font-weight: 700;
}
.how b { color: var(--cobalt); }
#levelsWrap { flex: 1; min-height: 0; overflow-y: auto; width: 100%; padding: 4px 0 8px; }
#levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; max-width: 360px; margin: 0 auto; }
.lv {
  aspect-ratio: 1; border-radius: 14px; background: var(--card); box-shadow: 0 4px 0 var(--tile-line);
  font-family: var(--display); font-size: 1.3rem; position: relative;
}
.lv.done { background: var(--cobalt); color: #fff; box-shadow: 0 4px 0 var(--cobalt-deep); }
.lv:disabled { opacity: .45; cursor: default; }
.lv .st { position: absolute; left: 0; right: 0; bottom: 3px; font-size: .55rem; color: var(--lemon); letter-spacing: 1px; }

/* ---------- Game ---------- */
.hud { display: flex; align-items: center; gap: 10px; }
.hud-mid { flex: 1; display: grid; gap: 6px; }
.hud-row { display: flex; justify-content: space-between; font-family: var(--display); font-size: 1.2rem; }
.timebar { height: 12px; border-radius: 999px; background: var(--card); border: 3px solid var(--cobalt); overflow: hidden; }
#timeFill { height: 100%; background: var(--lemon); transform-origin: left; transition: transform .1s linear; }
#timeFill.low { background: var(--red); }
#arena {
  flex: 1; position: relative; border-radius: 24px; background: rgba(255, 255, 255, .7);
  border: 4px solid var(--cobalt); box-shadow: inset 0 0 0 4px #fff; overflow: hidden; touch-action: none;
}
#lemon {
  --s: 1; position: absolute; width: calc(84px * var(--s)); height: calc(84px * var(--s));
  translate: -50% -50%; transition: left .12s ease-out, top .12s ease-out; cursor: pointer;
}
#lemon svg { width: 100%; height: 100%; filter: drop-shadow(0 5px 4px rgba(18, 48, 110, .25)); pointer-events: none; }
#lemon.pop { animation: pop .18s ease-out; }
@keyframes pop { 50% { scale: 1.2; } }

/* ---------- Overlays ---------- */
.overlay { position: fixed; inset: 0; background: rgba(18, 48, 110, .55); display: grid; place-items: center; padding: 16px; z-index: 10; }
.panel {
  background: var(--card); border-radius: 26px; padding: 22px 20px; text-align: center;
  max-width: 340px; width: 100%; box-shadow: 0 0 0 5px var(--cobalt), 0 20px 40px rgba(0, 0, 0, .25);
}
.panel h2 { font-family: var(--display); font-weight: 400; font-size: 2.2rem; margin: 0 0 6px; color: var(--cobalt); }
.panel p { font-weight: 700; line-height: 1.35; margin: 0 0 14px; }
.stars { font-size: 2.4rem; color: var(--lemon); letter-spacing: 4px; margin-bottom: 14px; text-shadow: 0 3px 0 var(--lemon-deep); }
.row { display: flex; flex-direction: column; gap: 12px; }
</style>
<!--BODY-->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="g-lemon" cx=".38" cy=".32" r=".75">
      <stop offset="0" stop-color="#fff6a8"/><stop offset=".5" stop-color="#f5c518"/><stop offset="1" stop-color="#c99200"/>
    </radialGradient>
    <symbol id="lemon-art" viewBox="0 0 64 64">
      <path d="M8 34c0-13 11-22 24-22s24 9 24 22-11 20-24 20S8 47 8 34z" fill="url(#g-lemon)" stroke="#a87800" stroke-width="2"/>
      <path d="M5 34c2-1 3-2 4-4M59 34c-2-1-3-2-4-4" stroke="#a87800" stroke-width="3" stroke-linecap="round"/>
      <path d="M32 12c2-5 7-7 12-6-2 5-7 7-12 6z" fill="#4c9a3a"/>
      <ellipse cx="23" cy="25" rx="6" ry="3" fill="#fff" opacity=".55" transform="rotate(-25 23 25)"/>
    </symbol>
    <symbol id="ic-home" viewBox="0 0 24 24"><path d="M3 11 12 3l9 8M5 9.5V21h5v-6h4v6h5V9.5" fill="none" stroke="#1d4596" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-sound" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" fill="#1d4596"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="#1d4596" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="ic-mute" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" fill="#1d4596"/><path d="M16 9l6 6M22 9l-6 6" fill="none" stroke="#1d4596" stroke-width="2.4" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<div id="loading" class="loading"><div class="spinner" aria-hidden="true"></div></div>
<div id="app" hidden>
  <section id="home" class="screen">
    <div class="home-top">
      <button class="icon-btn" id="soundBtn" type="button" data-ta="soundToggle"></button>
    </div>
    <div class="logo-tile"><h1>Tap the Lemon</h1></div>
    <p class="tagline" data-t="tagline"></p>
    <div class="how" data-th="how"></div>
    <button class="btn blue" id="playBtn" type="button">Play</button>
    <div id="levelsWrap"><div id="levels"></div></div>
  </section>

  <section id="game" class="screen" hidden>
    <div class="hud">
      <button class="icon-btn" id="homeBtn" type="button" data-ta="home"><svg><use href="#ic-home"/></svg></button>
      <div class="hud-mid">
        <div class="hud-row"><span id="hudLevel">Level 1</span><span id="hudHits">0 / 0</span></div>
        <div class="timebar"><div id="timeFill"></div></div>
      </div>
      <button class="icon-btn" id="soundBtn2" type="button" data-ta="soundToggle"></button>
    </div>
    <div id="arena"><div id="lemon"><svg><use href="#lemon-art"/></svg></div></div>
  </section>
</div>

<div class="overlay" id="winOv" hidden>
  <div class="panel">
    <h2 id="winTitle">Perfect!</h2>
    <div class="stars" id="winStars">★★★</div>
    <div class="row">
      <button class="btn blue" id="winNext" type="button">Next level</button>
      <button class="btn ghost" id="winHome" type="button" data-t="menu"></button>
    </div>
  </div>
</div>

<div class="overlay" id="loseOv" hidden>
  <div class="panel">
    <h2 data-t="timeUp">Time's up!</h2>
    <p id="loseText"></p>
    <div class="row">
      <button class="btn" id="loseMore" type="button" data-t="moreTime"></button>
      <button class="btn ghost" id="loseRetry" type="button" data-t="retry"></button>
    </div>
  </div>
</div>
