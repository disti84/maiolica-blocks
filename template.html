<title>Maiolica Blocks</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Maiolica Blocks — one-screen block puzzle over a Caltagirone-style maiolica wall.
   Palette and buttons from Dolce Sort, so the Paw Software games look like a family. */
:root {
  --cobalt: #1d4596;
  --cobalt-deep: #12306e;
  --lemon: #f5c518;
  --lemon-deep: #d9a400;
  --tile: #f7fafd;
  --tile-line: #c9d6ee;
  --ink: #15264f;
  --card: #ffffff;
  --cream: #fdf6e3;
  --red: #d7263d;
  --cell: 40px;        /* board cell, set by game.js */
  --tcell: 22px;       /* tray cell, set by game.js */
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background-color: var(--tile);
  background-image:
    radial-gradient(circle at 50% 50%, transparent 0 9px, var(--tile-line) 10px 11px, transparent 12px),
    radial-gradient(circle at 0 0, transparent 0 22px, var(--tile-line) 23px 24px, transparent 25px),
    radial-gradient(circle at 100% 0, transparent 0 22px, var(--tile-line) 23px 24px, transparent 25px),
    radial-gradient(circle at 0 100%, transparent 0 22px, var(--tile-line) 23px 24px, transparent 25px),
    radial-gradient(circle at 100% 100%, transparent 0 22px, var(--tile-line) 23px 24px, transparent 25px),
    linear-gradient(var(--tile-line) 0 1px, transparent 1px),
    linear-gradient(90deg, var(--tile-line) 0 1px, transparent 1px);
  background-size: 64px 64px;
  color: var(--ink);
  font-family: var(--body);
  font-weight: 800;
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
body.paused * { animation-play-state: paused !important; }
#app {
  height: 100%;
  max-width: 560px;
  margin: 0 auto;
  box-sizing: border-box;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex;
  flex-direction: column;
}
#app.wide { max-width: 980px; }
.screen { flex: 1; display: flex; flex-direction: column; min-height: 0; gap: 10px; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 3px solid var(--lemon); outline-offset: 2px; }

/* ---------- Loading ---------- */
.loading { position: fixed; inset: 0; display: grid; place-items: center; }
.spinner { width: 44px; height: 44px; border-radius: 50%; border: 5px solid var(--tile-line); border-top-color: var(--cobalt); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Buttons ---------- */
.btn {
  font-family: var(--display);
  font-size: 1.35rem;
  letter-spacing: .02em;
  color: var(--ink);
  background: var(--lemon);
  border-radius: 18px;
  padding: 14px 26px;
  box-shadow: 0 5px 0 var(--lemon-deep), 0 8px 18px rgba(18, 48, 110, .18);
  transition: transform .08s, box-shadow .08s;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--lemon-deep); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.blue { background: var(--cobalt); color: #fff; box-shadow: 0 5px 0 var(--cobalt-deep), 0 8px 18px rgba(18, 48, 110, .25); }
.btn.blue:active { box-shadow: 0 1px 0 var(--cobalt-deep); }
.btn.ghost { background: var(--card); box-shadow: 0 5px 0 var(--tile-line); font-size: 1.1rem; }
.ad-badge {
  font-family: var(--body); font-weight: 900; font-size: .62rem; letter-spacing: .06em;
  background: var(--cobalt); color: #fff; border-radius: 6px; padding: 2px 5px; line-height: 1.2;
}
.btn.blue .ad-badge { background: var(--lemon); color: var(--ink); }
.icon-btn {
  width: 44px; height: 44px; border-radius: 14px;
  background: var(--card); border: 3px solid var(--cobalt);
  display: grid; place-items: center; flex: none;
  box-shadow: 0 3px 0 var(--cobalt);
}
.icon-btn:active { transform: translateY(3px); box-shadow: none; }
.icon-btn svg { width: 24px; height: 24px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--card); border: 3px solid var(--cobalt); border-radius: 999px;
  padding: 4px 14px; font-variant-numeric: tabular-nums; font-size: 1rem;
}
.pill svg { width: 20px; height: 20px; }

/* ---------- Home ---------- */
#home { align-items: center; text-align: center; justify-content: center; gap: 14px; }
.home-top { width: 100%; display: flex; justify-content: space-between; align-items: center; }
.logo { display: grid; gap: 4px; justify-items: center; margin-top: 4px; }
.logo-tile {
  background: var(--cobalt); border-radius: 28px; padding: 16px 26px 14px;
  border: 5px solid #fff; box-shadow: 0 0 0 4px var(--cobalt), 0 14px 30px rgba(18, 48, 110, .28);
  rotate: -2deg;
}
.logo h1 {
  font-family: var(--display); font-weight: 400; margin: 0;
  font-size: clamp(2.5rem, 12.5vw, 3.6rem); line-height: .95;
  color: var(--lemon); text-shadow: 0 4px 0 var(--cobalt-deep);
}
.logo .sub { font-family: var(--display); color: #fff; font-size: 1.05rem; letter-spacing: .3em; text-transform: uppercase; }
.hero { display: flex; gap: 3px; margin: 10px 0 0; }
.hero svg { width: clamp(30px, 9vw, 40px); aspect-ratio: 1; height: auto; display: block; filter: drop-shadow(0 3px 0 rgba(18, 48, 110, .25)); }
.hero svg:nth-child(even) { translate: 0 -7px; }
.tagline { margin: 0; font-size: 1rem; }
.how {
  background: var(--card); border-radius: 18px; border: 3px solid var(--tile-line);
  padding: 10px 14px; font-size: .95rem; line-height: 1.35; max-width: 34ch; font-weight: 700;
}
.how b { color: var(--cobalt); }
.home-btns { display: grid; gap: 14px; width: min(100%, 300px); }

/* ---------- Game ---------- */
.hud { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; }
.score-box { text-align: center; line-height: 1; }
#score { font-family: var(--display); font-size: 2.3rem; color: var(--cobalt); text-shadow: 0 3px 0 #fff; font-variant-numeric: tabular-nums; display: inline-block; }
#score.bump { animation: bump .25s ease-out; }
@keyframes bump { 50% { scale: 1.18; } }
.best-line { font-size: .85rem; display: inline-flex; gap: 4px; align-items: center; color: var(--cobalt-deep); }
.best-line svg { width: 16px; height: 16px; }

#stage { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
#app.wide #stage { flex-direction: row; gap: 24px; }
.side { display: flex; flex-direction: column; align-items: center; gap: 12px; }

#boardWrap { position: relative; }
#board {
  display: grid; grid-template-columns: repeat(8, var(--cell)); grid-template-rows: repeat(8, var(--cell));
  padding: 6px; gap: 0; border-radius: 18px;
  background: var(--cobalt); border: 4px solid #fff;
  box-shadow: 0 0 0 4px var(--cobalt), 0 12px 0 var(--cobalt-deep), 0 18px 30px rgba(18, 48, 110, .25);
  touch-action: none;
}
.cell { width: var(--cell); height: var(--cell); position: relative; }
.cell::before {
  content: ""; position: absolute; inset: 2px; border-radius: 6px;
  background: #2a56ad; box-shadow: inset 0 2px 0 rgba(0, 0, 0, .18);
}
.cell svg { position: absolute; inset: 1px; width: calc(100% - 2px); height: calc(100% - 2px); display: block; }
.cell.pv::before { background: #6f8fd0; }
.cell.pv svg { display: none; }
.cell .ghost { opacity: .55; }
.cell.line svg { filter: brightness(1.18) drop-shadow(0 0 4px #fff7c2); }
.cell.line::after { content: ""; position: absolute; inset: 2px; border-radius: 6px; box-shadow: 0 0 0 2px var(--lemon); }
.cell.pop svg { animation: tilePop .38s ease-in forwards; }
@keyframes tilePop { 30% { scale: 1.15; } 100% { scale: 0; rotate: 40deg; opacity: 0; } }
.cell.drop svg { animation: tileDrop .16s ease-out; }
@keyframes tileDrop { from { scale: 1.12; } }

.float {
  position: absolute; left: 50%; top: 40%; translate: -50% -50%; pointer-events: none; white-space: nowrap;
  font-family: var(--display); font-size: 2rem; color: var(--lemon); z-index: 5;
  text-shadow: 0 3px 0 var(--cobalt-deep), 0 0 12px rgba(18, 48, 110, .6);
  animation: floatUp 1.1s ease-out forwards;
}
.float.small { font-size: 1.4rem; color: #fff; }
@keyframes floatUp { 0% { opacity: 0; scale: .6; } 15% { opacity: 1; scale: 1.1; } 70% { opacity: 1; } 100% { opacity: 0; transform: translateY(-40px); } }

#tray { display: flex; gap: 10px; justify-content: center; }
#app.traycol #tray, #app.traycol .boosters { flex-direction: column; }
.slot {
  width: calc(var(--tcell) * 5 + 12px); height: calc(var(--tcell) * 5 + 12px);
  display: grid; place-items: center; position: relative;
  background: rgba(255, 255, 255, .78); border: 3px solid var(--tile-line); border-radius: 18px;
  touch-action: none; cursor: grab;
}
.slot.lift .piece { opacity: 0; }
.slot.nofit .piece { opacity: .35; filter: grayscale(.8); }
.slot .rot {
  position: absolute; top: -8px; right: -8px; width: 28px; height: 28px; border-radius: 50%;
  background: var(--lemon); border: 3px solid #fff; display: grid; place-items: center;
  box-shadow: 0 2px 0 var(--lemon-deep); pointer-events: none;
}
.slot .rot svg { width: 16px; height: 16px; }
.piece { position: relative; pointer-events: none; transition: rotate .18s; }
.piece svg { position: absolute; display: block; }
.slot.spin .piece { animation: spinIn .22s ease-out; }
@keyframes spinIn { from { rotate: -90deg; } }
.slot.deal .piece { animation: dealIn .3s cubic-bezier(.2, 1.4, .4, 1) backwards; }
.slot.deal:nth-child(2) .piece { animation-delay: .06s; }
.slot.deal:nth-child(3) .piece { animation-delay: .12s; }
@keyframes dealIn { from { scale: 0; } }

#drag { position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none; filter: drop-shadow(0 8px 6px rgba(18, 48, 110, .35)); }
#drag svg { position: absolute; display: block; }

.boosters { display: flex; gap: 10px; justify-content: center; }
.boost {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--card); border: 3px solid var(--cobalt); border-radius: 16px;
  padding: 7px 12px; font-family: var(--display); font-size: 1rem; color: var(--cobalt);
  box-shadow: 0 3px 0 var(--cobalt);
}
.boost svg { width: 20px; height: 20px; flex: none; }
.boost:active { transform: translateY(3px); box-shadow: none; }
.boost:disabled { opacity: .4; cursor: default; box-shadow: none; border-style: dashed; transform: none; }
.boost.on, .boost.on:disabled { background: var(--lemon); border-color: var(--lemon-deep); box-shadow: 0 3px 0 var(--lemon-deep); border-style: solid; opacity: 1; color: var(--ink); }

/* ---------- Overlays ---------- */
.overlay { position: fixed; inset: 0; background: rgba(18, 48, 110, .55); display: grid; place-items: center; padding: 16px; z-index: 10; }
.panel {
  width: min(100%, 360px); box-sizing: border-box;
  background: var(--card); border-radius: 26px; border: 5px solid var(--cobalt);
  padding: 22px 18px 20px; display: grid; gap: 12px; justify-items: center; text-align: center;
  box-shadow: 0 14px 0 var(--cobalt-deep);
  animation: panelIn .35s cubic-bezier(.2, 1.4, .4, 1);
}
@keyframes panelIn { from { scale: .7; opacity: 0; } }
.panel h2 { font-family: var(--display); font-weight: 400; font-size: 2.1rem; margin: 0; color: var(--cobalt); line-height: 1.05; }
.panel p { font-weight: 700; line-height: 1.35; margin: 0; }
.final { font-family: var(--display); font-size: 3rem; color: var(--ink); line-height: 1; }
.record { font-family: var(--display); background: var(--lemon); color: var(--ink); border-radius: 999px; padding: 4px 16px; rotate: -3deg; box-shadow: 0 3px 0 var(--lemon-deep); }
.row { display: grid; gap: 12px; width: 100%; }
.row .btn { width: 100%; box-sizing: border-box; }
</style>
